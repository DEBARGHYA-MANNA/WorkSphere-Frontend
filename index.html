<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4f46e5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0d12" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="WorkSphere — One workspace. Every project. Better collaboration."
    />
    <title>WorkSphere</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of the
      // wrong colour scheme. Keep this key in sync with src/lib/theme.js.
      ;(function () {
        try {
          var stored = localStorage.getItem('worksphere-ui')
          var mode = stored ? (JSON.parse(stored) || {}).state?.theme : null
          var prefersDark =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var resolved = mode === 'dark' || mode === 'light' ? mode : prefersDark ? 'dark' : 'light'
          document.documentElement.classList.toggle('dark', resolved === 'dark')
          document.documentElement.style.colorScheme = resolved
        } catch (e) {
          /* first paint falls back to light */
        }
      })()
    </script>
  </head>
  <body class="h-full bg-background font-sans text-foreground antialiased">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
